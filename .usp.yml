llm:
  provider: anthropic
  model: claude-sonnet-4-6

accounts:
  x:
    main:
      targets:
        default: {}
  linkedin:
    me:
      author: urn:li:person:YOUR_PERSON_ID
      targets:
        default: {}
  reddit:
    main:
      userAgent: usp/0.1.0 by YOUR_REDDIT_USERNAME
      targets:
        release:
          subreddit: reddit_api_test
  telegram:
    main:
      targets:
        channel:
          chatId: "@sejqlkneljkwrbe"
  aegea:
    main:
      baseUrl: http://localhost/
      targets:
        blog: {}
  bluesky:
    main:
      pdsUrl: https://bsky.social
      targets:
        default: {}
  mastodon:
    main:
      instanceUrl: https://mastodon.social
      visibility: public
      targets:
        default: {}
  discord:
    main:
      username: Ultimate Social Poster
      targets:
        default: {}

profiles:
  default:
    targets:
      - x/main/default
      - linkedin/me/default
      - reddit/main/release
      - telegram/main/channel
      - aegea/main/blog
      - bluesky/main/default
      - mastodon/main/default
      - discord/main/default

prompts: {}
