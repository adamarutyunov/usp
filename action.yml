name: Ultimate Social Poster
description: Publish a Markdown file to social destinations through the usp CLI.
author: Adam Arutyunov

inputs:
  markdown:
    description: Markdown file to publish.
    required: true
  config:
    description: usp config path.
    required: false
    default: .usp.yml
  profile:
    description: Config profile to publish.
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: ${{ github.action_path }}/package.json

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
      working-directory: ${{ github.action_path }}

    - name: Build usp
      shell: bash
      run: pnpm build
      working-directory: ${{ github.action_path }}

    - name: Publish
      shell: bash
      run: >
        node "${{ github.action_path }}/dist/cli.js" publish "${{ inputs.markdown }}"
        --config "${{ inputs.config }}"
        --profile "${{ inputs.profile }}"

branding:
  icon: send
  color: blue
