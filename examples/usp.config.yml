llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  apiKey: paste-gemini-api-key-here

profiles:
  default:
    targets:
      - x-main
      - linkedin-me
      - reddit-release
      - telegram-channel
      - aegea-blog
      - bluesky-main
      - mastodon-main
      - discord-main
      - threads-main

targets:
  x-main:
    platform: x
    account: main

  linkedin-me:
    platform: linkedin
    account: me

  reddit-release:
    platform: reddit
    account: main

  telegram-channel:
    platform: telegram
    account: main

  aegea-blog:
    platform: aegea
    account: main

  bluesky-main:
    platform: bluesky
    account: main

  mastodon-main:
    platform: mastodon
    account: main

  discord-main:
    platform: discord
    account: main

  threads-main:
    platform: threads
    account: main

accounts:
  x:
    main:
      consumerKey: paste-x-consumer-key-here
      consumerSecret: paste-x-consumer-secret-here
      accessToken: paste-x-access-token-here
      accessTokenSecret: paste-x-access-token-secret-here

  linkedin:
    me:
      accessToken: paste-linkedin-access-token-here
      author: urn:li:person:YOUR_PERSON_ID
      version: "202602"

  reddit:
    main:
      clientId: paste-reddit-client-id-here
      clientSecret: paste-reddit-client-secret-here
      refreshToken: paste-reddit-refresh-token-here
      subreddit: reddit_api_test
      userAgent: usp/0.1.0 by YOUR_REDDIT_USERNAME

  telegram:
    main:
      botToken: paste-telegram-bot-token-here
      chatId: "@your_channel"

  aegea:
    main:
      baseUrl: http://localhost/
      password: paste-aegea-password-here

  bluesky:
    main:
      identifier: your-handle.bsky.social
      appPassword: paste-bluesky-app-password-here
      pdsUrl: https://bsky.social

  mastodon:
    main:
      instanceUrl: https://mastodon.social
      accessToken: paste-mastodon-access-token-here
      visibility: public

  discord:
    main:
      webhookUrl: paste-discord-webhook-url-here
      username: Ultimate Social Poster
      avatarUrl: ""

  threads:
    main:
      accessToken: paste-threads-access-token-here
      userId: me
      username: your_threads_username
      replyControl: everyone
