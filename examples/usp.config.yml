# Example usp project config (.usp.yml).
#
# Structure is nested: platform -> account (auth) -> targets (where you post + an optional prompt).
# Credentials normally live in ~/.config/usp/social-auth (written by `usp setup`) or come from
# environment variables, NOT in this committed file. They are shown inline here only as a reference.

llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  # apiKey: comes from GEMINI_API_KEY by convention, or run `usp setup`.

# Optional platform-level prompt tweaks (layer 2). Applies to every target of the platform.
prompts:
  x:
    mode: append
    text: House style — terse and factual.

accounts:
  # X: one account posts to its own timeline. Extra targets are just prompt variants.
  x:
    main:
      # consumerKey / consumerSecret / accessToken / accessTokenSecret -> social-auth or X_* env vars
      targets:
        default: {}
        es:
          prompt:
            mode: replace
            text: Escribe un solo tuit en español.

  # Telegram: one bot (account) posts to many chats (targets).
  telegram:
    newsbot:
      # botToken -> social-auth or TELEGRAM_BOT_TOKEN
      targets:
        en:
          chatId: "@your_channel"
        ru:
          chatId: "@your_channel_ru"
          prompt:
            mode: append
            text: Write in Russian.

  # Reddit: one account posts to many subreddits (targets).
  reddit:
    main:
      # clientId / clientSecret / refreshToken -> social-auth or REDDIT_* env vars
      targets:
        showoff:
          subreddit: reddit_api_test

# A profile is a named set of target ids (platform/account/target).
profiles:
  default:
    targets:
      - x/main/default
      - telegram/newsbot/en
      - reddit/main/showoff

# Per-target defaults for the interactive publish picker: off | as-is | llm.
postingDefaults:
  x/main/default: llm
  telegram/newsbot/en: as-is
